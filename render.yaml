services:
  - type: web
    name: tech-army-backend
    runtime: python
    region: singapore
    rootDir: Tech_Army
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn Tech_Army.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: tech-army-db
          property: connectionString

databases:
  - name: tech-army-db
    databaseName: tech_army
    user: tech_army_user
    region: singapore
